<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>بنك أسئلة اللغة الإنجليزية - اختبار تفاعلي</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Tajawal', sans-serif;
    }
    .font-en {
      font-family: 'Inter', sans-serif;
      direction: ltr;
      text-align: left;
    }
    .custom-shadow {
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-indigo-900 text-white shadow-lg sticky top-0 z-30">
    <div class="max-w-5xl mx-auto px-4 py-3 sm:py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-indigo-700/80 flex items-center justify-center font-bold text-xl text-indigo-200">
          🇬🇧
        </div>
        <div>
          <h1 class="text-lg sm:text-xl font-bold leading-tight">بنك أسئلة اللغة الإنجليزية</h1>
          <p class="text-xs text-indigo-300">اختبار تفاعلي شامل مع الترجمة وشرح القواعد</p>
        </div>
      </div>

      <!-- Stats Bar -->
      <div class="flex items-center gap-2 sm:gap-4 text-xs sm:text-sm">
        <div class="bg-indigo-800/80 px-3 py-1.5 rounded-lg border border-indigo-700/50 flex items-center gap-1.5">
          <span class="text-emerald-400 font-bold" id="headerCorrectCount">0</span>
          <span class="text-indigo-300">صح</span>
          <span class="text-slate-400">|</span>
          <span class="text-rose-400 font-bold" id="headerWrongCount">0</span>
          <span class="text-indigo-300">خطأ</span>
        </div>
        <button id="resetQuizBtn" class="bg-indigo-700 hover:bg-indigo-600 active:scale-95 text-white px-3 py-1.5 rounded-lg text-xs transition duration-150 flex items-center gap-1">
          🔄 إعادة
        </button>
      </div>
    </div>
  </header>

  <!-- Control & Filter Bar -->
  <div class="bg-white border-b border-slate-200 sticky top-[57px] sm:top-[69px] z-20 shadow-sm">
    <div class="max-w-5xl mx-auto px-4 py-2.5 flex flex-wrap items-center justify-between gap-2">
      <!-- Mode Toggle -->
      <div class="flex items-center bg-slate-100 p-1 rounded-xl text-xs font-semibold">
        <button id="modePractice" class="px-3 py-1.5 rounded-lg bg-white shadow text-indigo-700 transition font-bold">
          💡 تصحيح فوري
        </button>
        <button id="modeTest" class="px-3 py-1.5 rounded-lg text-slate-600 hover:text-indigo-700 transition font-medium">
          📝 وضع الامتحان الكامل
        </button>
      </div>

      <!-- Filters -->
      <div class="flex items-center gap-1 text-xs overflow-x-auto pb-1 sm:pb-0">
        <button data-filter="all" class="filter-btn active px-2.5 py-1 rounded-lg bg-indigo-50 text-indigo-700 font-bold border border-indigo-200">
          الكل (<span id="totalCountBadge">0</span>)
        </button>
        <button data-filter="wrong" class="filter-btn px-2.5 py-1 rounded-lg text-slate-600 hover:bg-slate-100">
          الخاطئة (<span id="wrongCountBadge">0</span>)
        </button>
        <button data-filter="unanswered" class="filter-btn px-2.5 py-1 rounded-lg text-slate-600 hover:bg-slate-100">
          المتبقية (<span id="unansweredCountBadge">0</span>)
        </button>
      </div>
    </div>

    <!-- Progress Bar -->
    <div class="w-full bg-slate-100 h-1.5">
      <div id="progressBar" class="bg-indigo-600 h-1.5 transition-all duration-300 w-0"></div>
    </div>
  </div>

  <!-- Main Container -->
  <main class="max-w-5xl mx-auto px-4 py-6 flex-1 w-full grid grid-cols-1 lg:grid-cols-4 gap-6">

    <!-- Questions Area -->
    <div class="lg:col-span-3 space-y-4" id="questionsContainer">
      <!-- Questions will be injected here via JavaScript -->
    </div>

    <!-- Sidebar / Question Navigator -->
    <aside class="lg:col-span-1">
      <div class="bg-white rounded-2xl p-4 border border-slate-200 custom-shadow sticky top-28 space-y-4">
        <div class="flex items-center justify-between border-b pb-3">
          <h2 class="font-bold text-sm text-slate-700">خريطة الأسئلة</h2>
          <span class="text-xs text-slate-400" id="progressStatus">0 / 0</span>
        </div>

        <div class="grid grid-cols-5 gap-1.5 max-h-[350px] overflow-y-auto p-1" id="navigatorGrid">
          <!-- Question buttons injected here -->
        </div>

        <div class="text-[11px] text-slate-500 space-y-1.5 pt-2 border-t border-slate-100">
          <div class="flex items-center gap-2">
            <span class="w-3 h-3 rounded-full bg-emerald-500"></span> إجابة صحيحة
          </div>
          <div class="flex items-center gap-2">
            <span class="w-3 h-3 rounded-full bg-rose-500"></span> إجابة خاطئة
          </div>
          <div class="flex items-center gap-2">
            <span class="w-3 h-3 rounded-full bg-slate-200"></span> لم تُحل بعد
          </div>
        </div>

        <div id="examSubmitContainer" class="hidden pt-2">
          <button id="finishExamBtn" class="w-full py-2.5 px-4 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-xs transition shadow-md">
            إنهاء الامتحان ورؤية النتيجة
          </button>
        </div>
      </div>
    </aside>

  </main>

  <!-- Score Modal -->
  <div id="resultModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white rounded-3xl p-6 sm:p-8 max-w-md w-full text-center space-y-5 shadow-2xl">
      <div id="modalIcon" class="text-5xl">🎉</div>
      <h3 class="text-2xl font-black text-slate-800" id="modalTitle">اكتمل الاختبار!</h3>
      <div class="p-4 bg-indigo-50 rounded-2xl space-y-2">
        <p class="text-sm text-indigo-700">نتيجتك النهائية:</p>
        <p class="text-4xl font-extrabold text-indigo-900" id="finalScoreDisplay">0 / 0</p>
        <p class="text-xs text-indigo-600 font-semibold" id="finalPercentage">0%</p>
      </div>
      <div class="flex gap-3">
        <button onclick="closeModal()" class="flex-1 py-2.5 px-4 rounded-xl bg-slate-100 text-slate-700 text-xs font-bold hover:bg-slate-200 transition">
          مراجعة الإجابات
        </button>
        <button onclick="restartQuiz()" class="flex-1 py-2.5 px-4 rounded-xl bg-indigo-600 text-white text-xs font-bold hover:bg-indigo-700 transition">
          إعادة المحاولة
        </button>
      </div>
    </div>
  </div>

  <script>
    const questionsData = [
      {
        id: 1,
        question: "Can you call me back later? I ............ my assignment.",
        questionAr: "هل يمكنك معاودة الاتصال بي لاحقاً؟ أنا أقوم بعمل واجبي الآن.",
        options: ["do", "doing", "am doing"],
        correctIndex: 2,
        explanation: "قاعدة المضارع المستمر (Present Continuous): نستخدم (am + v-ing) لأن الحدث يقع الآن في لحظة التحدث (call me back later)."
      },
      {
        id: 2,
        question: "I like to spend time with my friends. That's what ............ me happy.",
        questionAr: "أحب قضاء الوقت مع أصدقائي. هذا ما يجعلني سعيداً.",
        options: ["makes", "make", "is making"],
        correctIndex: 0,
        explanation: "قاعدة المضارع البسيط: الفاعل هنا هو العبارة الاسمية الممثلة بضمير المفرد غير العاقل (That's what)، وفي المفرد يضاف للفعل (s)."
      },
      {
        id: 3,
        question: "She always ............ a book to her son before he goes to sleep.",
        questionAr: "هي دائماً تقرأ كتاباً لابنها قبل أن يذهب للنوم.",
        options: ["read", "reads", "is reading"],
        correctIndex: 1,
        explanation: "مضارع بسيط يعبر عن عادة متكررة بوجود كلمة (always)، ومع الضمير المفرد الغائب (She) يأخذ الفعل حرف (s)."
      },
      {
        id: 4,
        question: "He doesn't like fish. He ............ eats it.",
        questionAr: "هو لا يحب السمك، هو لا يأكله أبداً.",
        options: ["always", "usually", "never"],
        correctIndex: 2,
        explanation: "كلمة (never) تعني أبداً وتفيد النفي التام مع الإبقاء على شكل الفعل مثبتاً (never eats)."
      },
      {
        id: 5,
        question: "John gets a ............ for his good work.",
        questionAr: "حصل جون على مكافأة إضافية تقديراً لعمله الجيد.",
        options: ["bonus", "salary", "task"],
        correctIndex: 0,
        explanation: "مفردات: (bonus) تعني مكافأة إضافية عن العمل الجيد، بينما (salary) هو الراتب الأساسي، و(task) تعني مهمة."
      },
      {
        id: 6,
        question: "Rescue workers often ............ their lives to help other people in danger.",
        questionAr: "غالباً ما يُخاطر عمال الإنقاذ بحياتهم لمساعدة المعرضين للخطر.",
        options: ["save", "risk", "take care"],
        correctIndex: 1,
        explanation: "المصطلح الشائع هو (risk their lives) بمعنى يُخاطرون بحياتهم."
      },
      {
        id: 7,
        question: "They ............ late for school.",
        questionAr: "هم دائماً متأخرون عن المدرسة.",
        options: ["never are", "always are", "are always"],
        correctIndex: 2,
        explanation: "قاعدة موقع ظروف التكرار (Adverbs of frequency): تأتي ظروف التكرار (always / never) دائماً بعد فعل يكون (Verb to be) وليس قبله."
      },
      {
        id: 8,
        question: "Mark ............ in London.",
        questionAr: "مارك يعيش في لندن.",
        options: ["live", "lives", "am living"],
        correctIndex: 1,
        explanation: "مضارع بسيط يعبر عن حقيقة/استقرار دائم، والفاعل مفرد غائب (Mark) فيضاف للفعل (s)."
      },
      {
        id: 9,
        question: "A ............ is a person employed to report for a newspaper or broadcasting from abroad.",
        questionAr: "هو الشخص المعين لكتابة التقارير لصحيفة أو البث الإذاعي من الخارج.",
        options: ["actress", "foreign correspondent", "fashion designer"],
        correctIndex: 1,
        explanation: "مفردات الوظائف: (foreign correspondent) تعني مراسل صحفي أجنبي/خارجي."
      },
      {
        id: 10,
        question: "How often do you ............ a snack?",
        questionAr: "كم مرة تتناول وجبة خفيفة؟",
        options: ["spend", "go", "have"],
        correctIndex: 2,
        explanation: "المتلازمات اللفظية (Collocations): نستخدم الفعل (have) مع الوجبات والمأكولات الخفيفة (have a snack / have lunch)."
      },
      {
        id: 11,
        question: "We ............ our final exam at the moment.",
        questionAr: "نحن نؤدي امتحاننا النهائي في هذه اللحظة.",
        options: ["took", "are taking", "take"],
        correctIndex: 1,
        explanation: "وجود العبارة الدالة (at the moment) يوجب استخدام المضارع المستمر (are + verb-ing) مع ضمير الجمع (We)."
      },
      {
        id: 12,
        question: "My job is difficult, but I get a good ............",
        questionAr: "وظيفتي صعبة، لكني أتقاضى راتباً جيداً.",
        options: ["customer", "task", "salary"],
        correctIndex: 2,
        explanation: "مفردات: (salary) تعني الراتب الشهري أو الدوري مقابل الوظيفة."
      },
      {
        id: 13,
        question: "I like to ............ shopping.",
        questionAr: "أحب أن أذهب للتسوق.",
        options: ["go", "have", "do"],
        correctIndex: 0,
        explanation: "متلازمة لفظية: الأنشطة التي تنتهي بـ (ing) مثل التسوق والسباحة تأخذ الفعل (go): go shopping."
      },
      {
        id: 14,
        question: "I ............ my assignment last night.",
        questionAr: "أنا لم أنهِ واجبي الليلة الماضية.",
        options: ["am finishing", "didn't finish", "finish"],
        correctIndex: 1,
        explanation: "قاعدة الماضي البسيط: الكلمة الدالة (last night) تشير للماضي، والنفي في الماضي البسيط يكون بـ (didn't + المصدر)."
      },
      {
        id: 15,
        question: "Doctors ............ their lives to protect us during COVID 19.",
        questionAr: "خاطر الأطباء بحياتهم لحمايتنا أثناء أزمة كوفيد 19.",
        options: ["risk", "rescue", "deal"],
        correctIndex: 0,
        explanation: "تعبير لغوي: (risk lives) يعني يُخاطر بالأرواح."
      },
      {
        id: 16,
        question: "How often do you play tennis? - I ............ it twice a week.",
        questionAr: "كم مرة تلعب التنس؟ - ألعبها مرتين في الأسبوع.",
        options: ["plays", "play", "am playing"],
        correctIndex: 1,
        explanation: "السؤال بـ (How often) والإجابة بـ (twice a week) تعبر عن روتين متكرر، لذا نستخدم المضارع البسيط (play) مع الضمير (I)."
      },
      {
        id: 17,
        question: "I help people to stay fit and healthy. I am a ............",
        questionAr: "أساعد الناس على البقاء بلياقة وصحة جيدة. أنا مدرب شخصي.",
        options: ["personal trainer", "fashion designer", "IT consultant"],
        correctIndex: 0,
        explanation: "المدرب البدني الشخصي هو (Personal Trainer)."
      },
      {
        id: 18,
        question: "I don't like my ............ He is a tough man.",
        questionAr: "أنا لا أحب مديري في العمل، إنه رجل قاسٍ.",
        options: ["boss", "salary", "task"],
        correctIndex: 0,
        explanation: "الضمير (He) يعود على شخص عاقل وهو المدير (boss)."
      },
      {
        id: 19,
        question: "He wants to work alone. He doesn't like working in a/an ............",
        questionAr: "هو يريد أن يعمل بمفرده، لا يحب العمل داخل فريق.",
        options: ["online", "desk", "team"],
        correctIndex: 2,
        explanation: "العمل بمفرده (alone) عكس العمل في فريق (team)."
      },
      {
        id: 20,
        question: "She didn't ............ to the gym last week.",
        questionAr: "هي لم تذهب إلى الجيم الأسبوع الماضي.",
        options: ["go", "went", "going"],
        correctIndex: 0,
        explanation: "قاعدة نفي الماضي: بعد (didn't) يجب أن يأتي الفعل في المصدر المجرد (go)."
      },
      {
        id: 21,
        question: "\"He proposed to her\" means:",
        questionAr: "عبارة 'طلب يدها للزواج' تعني:",
        options: ["He proposed to her", "They get divorced", "He didn't have a girlfriend"],
        correctIndex: 0,
        explanation: "تعبير (propose to someone) يعني التقدم بطلب الزواج منها (asked her to marry him)."
      },
      {
        id: 22,
        question: "Choose the right question for the answer: 'He lives near the city.'",
        questionAr: "اختر السؤال الصحيح للإجابة: 'هو يعيش بالقرب من المدينة.'",
        options: ["Where does he lives?", "Where he does live?", "Where does he live ?"],
        correctIndex: 2,
        explanation: "قاعدة تكوين السؤال: (أداة الاستفهام + does + الفاعل + الفعل في المصدر بدون s) -> Where does he live?"
      },
      {
        id: 23,
        question: "Choose the right question for the answer: 'He works near the city.'",
        questionAr: "اختر السؤال الصحيح للإجابة: 'هو يعمل بالقرب من المدينة.'",
        options: ["Where does he works?", "Where he does work?", "Where does he work?"],
        correctIndex: 2,
        explanation: "تكوين السؤال الصحيح يتطلب المصدر بعد does: (Where does he work?)."
      },
      {
        id: 24,
        question: "When he ............ her to marry him, she said yes.",
        questionAr: "عندما طلب منها الزواج، وافقت وقالت نعم.",
        options: ["accepted", "asked", "got"],
        correctIndex: 1,
        explanation: "سياق لغوي: (asked her to marry him) تعني طلب منها الزواج."
      },
      {
        id: 25,
        question: "I ............ in London now.",
        questionAr: "أنا أعيش في لندن الآن.",
        options: ["live", "lives", "am living"],
        correctIndex: 0,
        explanation: "الفعل (live) عند التعبير عن مكان الإقامة الدائم يُستخدم في المضارع البسيط (live) مع الضمير (I)."
      },
      {
        id: 26,
        question: "He doesn't like golf, ............ ",
        questionAr: "هو لا يحب الجولف، لذلك هو لا يلعبه أبداً.",
        options: ["he never plays it", "he always plays it", "he usually plays it"],
        correctIndex: 0,
        explanation: "عدم حب الرياضة يترتب عليه عدم ممارستها نهائياً (never plays it)."
      },
      {
        id: 27,
        question: "Ahmed can ............ with problems.",
        questionAr: "أحمد يستطيع التعامل مع المشكلات.",
        options: ["get", "deal", "rescue"],
        correctIndex: 1,
        explanation: "حرف الجر (with) يقترن بالفعل (deal) ليعطي معنى يتعامل مع: (deal with)."
      },
      {
        id: 28,
        question: "She works hard during the week so she ............ works at weekends.",
        questionAr: "هي تعمل بجد طوال أيام الأسبوع، لذا نادراً ما تعمل في عطلات نهاية الأسبوع.",
        options: ["rarely", "always", "usually"],
        correctIndex: 0,
        explanation: "كلمة (rarely) تعني نادراً وتتناسب مع سبب إرهاقها طوال الأسبوع."
      },
      {
        id: 29,
        question: "John loves to be an IT ............ and says he enjoys dealing with computer problems.",
        questionAr: "جون يحب أن يكون مستشار تكنولوجيا معلومات ويستمتع بحل مشاكل الحاسوب.",
        options: ["designer", "consultant", "courier"],
        correctIndex: 1,
        explanation: "الوظيفة المتعلقة بأنظمة وتكنولوجيا المعلومات والشركات هي (IT consultant)."
      },
      {
        id: 30,
        question: "There ............ a big storm last night.",
        questionAr: "كانت هناك عاصفة كبيرة الليلة الماضية.",
        options: ["were", "was", "is"],
        correctIndex: 1,
        explanation: "العاصفة اسم مفرد (a big storm) والزمن ماضٍ بسيط بوجود (last night)، لذا نستخدم (was)."
      },
      {
        id: 31,
        question: "Joe ............ his emails every morning.",
        questionAr: "جو يتفقد رسائله الإلكترونية كل صباح.",
        options: ["checked", "checks", "checking"],
        correctIndex: 1,
        explanation: "مضارع بسيط يعبر عن عادة روتينية (every morning) مع فاعل مفرد (Joe) فيأخذ الفعل s."
      },
      {
        id: 32,
        question: "............ is your birthday? - It's in July.",
        questionAr: "متى عيد ميلادك؟ - إنه في شهر يوليو.",
        options: ["When", "What", "Where"],
        correctIndex: 0,
        explanation: "للسؤال عن الوقت والتواريخ نستخدم أداة الاستفهام (When)."
      },
      {
        id: 33,
        question: "............ do you come to school; by bus or by car?",
        questionAr: "كيف تأتي إلى المدرسة؛ بالحافلة أم بالسيارة؟",
        options: ["when", "why", "how"],
        correctIndex: 2,
        explanation: "للسؤال عن وسيلة المواصلات أو الكيفية نستخدم أداة الاستفهام (How)."
      },
      {
        id: 34,
        question: "Where ............ she live?",
        questionAr: "أين تعيش هي؟",
        options: ["does", "do", "is"],
        correctIndex: 0,
        explanation: "في المضارع البسيط مع الفاعل المفرد (she) نستخدم الفعل المساعد (does)."
      },
      {
        id: 35,
        question: "We ............ go on holidays last year.",
        questionAr: "نحن لم نذهب في عطلات العام الماضي.",
        options: ["weren't", "didn't", "don't"],
        correctIndex: 1,
        explanation: "لنفي فعل أساسي (go) في زمن الماضي البسيط (last year) نستخدم (didn't)."
      },
      {
        id: 36,
        question: "............ are you studying English? - Do you need it for your job?",
        questionAr: "لماذا تدرس الإنجليزية؟ - هل تحتاجها لوظيفتك؟",
        options: ["how", "when", "why"],
        correctIndex: 2,
        explanation: "للسؤال عن السبب والهدف نستخدم أداة الاستفهام (Why)."
      },
      {
        id: 37,
        question: "They often ............ a barbecue on Sundays.",
        questionAr: "هم غالباً ما يقيمون حفلة شواء في أيام الأحد.",

    // State
    let userAnswers = {};
    let currentMode = 'practice';
    let currentFilter = 'all';

    // DOM Elements
    const questionsContainer = document.getElementById('questionsContainer');
    const navigatorGrid = document.getElementById('navigatorGrid');
    const headerCorrect = document.getElementById('headerCorrectCount');
    const headerWrong = document.getElementById('headerWrongCount');
    const progressBar = document.getElementById('progressBar');
    const progressStatus = document.getElementById('progressStatus');
    const totalBadge = document.getElementById('totalCountBadge');
    const wrongBadge = document.getElementById('wrongCountBadge');
    const unansweredBadge = document.getElementById('unansweredCountBadge');
    const examSubmitContainer = document.getElementById('examSubmitContainer');
    const finishExamBtn = document.getElementById('finishExamBtn');
    const modePractice = document.getElementById('modePractice');
    const modeTest = document.getElementById('modeTest');

    totalBadge.textContent = questionsData.length;

    function init() {
      renderQuestions();
      renderNavigator();
      updateStats();
      attachEvents();
    }

    function attachEvents() {
      modePractice.addEventListener('click', () => switchMode('practice'));
      modeTest.addEventListener('click', () => switchMode('test'));
      document.getElementById('resetQuizBtn').addEventListener('click', restartQuiz);
      finishExamBtn.addEventListener('click', submitExam);

      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          document.querySelectorAll('.filter-btn').forEach(b => {
            b.classList.remove('bg-indigo-50', 'text-indigo-700', 'font-bold', 'border', 'border-indigo-200');
            b.classList.add('text-slate-600');
          });
          btn.classList.add('bg-indigo-50', 'text-indigo-700', 'font-bold', 'border', 'border-indigo-200');
          btn.classList.remove('text-slate-600');
          currentFilter = btn.dataset.filter;
          filterQuestions();
        });
      });
    }

    function switchMode(mode) {
      currentMode = mode;
      if (mode === 'practice') {
        modePractice.className = "px-3 py-1.5 rounded-lg bg-white shadow text-indigo-700 font-bold transition";
        modeTest.className = "px-3 py-1.5 rounded-lg text-slate-600 hover:text-indigo-700 transition font-medium";
        examSubmitContainer.classList.add('hidden');
      } else {
        modeTest.className = "px-3 py-1.5 rounded-lg bg-white shadow text-indigo-700 font-bold transition";
        modePractice.className = "px-3 py-1.5 rounded-lg text-slate-600 hover:text-indigo-700 transition font-medium";
        examSubmitContainer.classList.remove('hidden');
      }
      renderQuestions();
      renderNavigator();
      updateStats();
    }

    function renderQuestions() {
      questionsContainer.innerHTML = '';

      questionsData.forEach((q, idx) => {
        const isAnswered = userAnswers.hasOwnProperty(q.id);
        const selectedIdx = userAnswers[q.id];
        const isCorrect = isAnswered && selectedIdx === q.correctIndex;

        const card = document.createElement('div');
        card.className = `question-card bg-white rounded-2xl p-5 border border-slate-200 custom-shadow transition-all duration-200`;
        card.id = `q-card-${q.id}`;
        card.dataset.id = q.id;

        let statusBadge = '';
        if (currentMode === 'practice' && isAnswered) {
          statusBadge = isCorrect
            ? `<span class="bg-emerald-100 text-emerald-700 font-bold px-2.5 py-1 rounded-full text-xs flex items-center gap-1">✓ إجابة صحيحة</span>`
            : `<span class="bg-rose-100 text-rose-700 font-bold px-2.5 py-1 rounded-full text-xs flex items-center gap-1">✕ إجابة خاطئة</span>`;
        }

        let optionsHtml = '';
        q.options.forEach((opt, optIdx) => {
          let optClasses = "border-slate-200 hover:bg-slate-50 text-slate-700";
          let circleContent = String.fromCharCode(65 + optIdx);
          let circleClasses = "border-slate-300 text-slate-500 bg-white";

          if (isAnswered) {
            if (currentMode === 'practice') {
              if (optIdx === q.correctIndex) {
                optClasses = "bg-emerald-50/80 border-emerald-500 text-emerald-900 font-semibold";
                circleClasses = "bg-emerald-600 border-emerald-600 text-white";
                circleContent = "✓";
              } else if (optIdx === selectedIdx && !isCorrect) {
                optClasses = "bg-rose-50/80 border-rose-500 text-rose-900 font-semibold";
                circleClasses = "bg-rose-600 border-rose-600 text-white";
                circleContent = "✕";
              } else {
                optClasses = "opacity-60 border-slate-200 text-slate-500";
              }
            } else {
              if (optIdx === selectedIdx) {
                optClasses = "bg-indigo-50 border-indigo-600 text-indigo-900 font-semibold";
                circleClasses = "bg-indigo-600 border-indigo-600 text-white";
              }
            }
          }

          optionsHtml += `
            <button
              onclick="selectAnswer(${q.id}, ${optIdx})"
              class="w-full text-left font-en p-3 sm:p-3.5 rounded-xl border-2 ${optClasses} transition-all duration-150 flex items-start gap-3 group text-sm"
              ${currentMode === 'practice' && isAnswered ? 'disabled' : ''}
            >
              <span class="w-6 h-6 rounded-lg border flex-shrink-0 flex items-center justify-center text-xs font-bold ${circleClasses} transition">
                ${circleContent}
              </span>
              <span class="flex-1 pt-0.5 leading-relaxed">${escapeHtml(opt)}</span>
            </button>
          `;
        });

        let explanationHtml = '';
        if (currentMode === 'practice' && isAnswered) {
          explanationHtml = `
            <div class="mt-4 p-3.5 bg-slate-50 rounded-xl border-r-4 ${isCorrect ? 'border-r-emerald-500' : 'border-r-rose-500'} text-xs sm:text-sm text-slate-700 leading-relaxed">
              <strong class="font-bold text-slate-900 block mb-1">💡 شرح القاعدة والتصحيح:</strong>
              ${q.explanation}
            </div>
          `;
        }

        card.innerHTML = `
          <div class="flex items-center justify-between gap-3 mb-2 border-b border-slate-100 pb-2">
            <span class="text-xs font-bold text-indigo-700 bg-indigo-50 px-2.5 py-1 rounded-lg">
              السؤال ${idx + 1}
            </span>
            <div id="status-tag-${q.id}">
              ${statusBadge}
            </div>
          </div>
          
          <p class="font-en text-base sm:text-lg font-bold text-slate-800 mb-1 leading-relaxed">
            ${escapeHtml(q.question)}
          </p>

          <div class="bg-indigo-50/60 text-indigo-950 px-3 py-1.5 rounded-lg text-xs sm:text-sm font-semibold mb-3 flex items-center gap-1.5 border border-indigo-100">
            <span class="text-indigo-500 font-bold">الترجمة:</span>
            <span>${escapeHtml(q.questionAr)}</span>
          </div>

          <div class="space-y-2.5">
            ${optionsHtml}
          </div>
          <div id="explanation-box-${q.id}">
            ${explanationHtml}
          </div>
        `;

        questionsContainer.appendChild(card);
      });

      filterQuestions();
    }

    function renderNavigator() {
      navigatorGrid.innerHTML = '';
      questionsData.forEach((q, idx) => {
        const isAnswered = userAnswers.hasOwnProperty(q.id);
        const selectedIdx = userAnswers[q.id];
        const isCorrect = isAnswered && selectedIdx === q.correctIndex;

        let btnClass = "bg-slate-100 text-slate-600 hover:bg-slate-200";

        if (isAnswered) {
          if (currentMode === 'practice') {
            btnClass = isCorrect
              ? "bg-emerald-500 text-white font-bold"
              : "bg-rose-500 text-white font-bold";
          } else {
            btnClass = "bg-indigo-600 text-white font-bold";
          }
        }

        const navBtn = document.createElement('button');
        navBtn.className = `w-8 h-8 rounded-lg text-xs transition active:scale-90 flex items-center justify-center ${btnClass}`;
        navBtn.textContent = idx + 1;
        navBtn.onclick = () => scrollToQuestion(q.id);
        navigatorGrid.appendChild(navBtn);
      });
    }

    function selectAnswer(questionId, optionIndex) {
      userAnswers[questionId] = optionIndex;
      renderQuestions();
      renderNavigator();
      updateStats();
    }

    function scrollToQuestion(id) {
      const el = document.getElementById(`q-card-${id}`);
      if (el) {
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        el.classList.add('ring-2', 'ring-indigo-500');
        setTimeout(() => el.classList.remove('ring-2', 'ring-indigo-500'), 1200);
      }
    }

    function updateStats() {
      let correct = 0;
      let wrong = 0;
      const total = questionsData.length;
      const answeredCount = Object.keys(userAnswers).length;

      questionsData.forEach(q => {
        if (userAnswers.hasOwnProperty(q.id)) {
          if (userAnswers[q.id] === q.correctIndex) {
            correct++;
          } else {
            wrong++;
          }
        }
      });

      headerCorrect.textContent = correct;
      headerWrong.textContent = wrong;
      wrongBadge.textContent = wrong;
      unansweredBadge.textContent = total - answeredCount;

      const progressPercent = (answeredCount / total) * 100;
      progressBar.style.width = `${progressPercent}%`;
      progressStatus.textContent = `${answeredCount} / ${total}`;
    }

    function filterQuestions() {
      const cards = document.querySelectorAll('.question-card');
      cards.forEach(card => {
        const qId = parseInt(card.dataset.id);
        const isAnswered = userAnswers.hasOwnProperty(qId);
        const isCorrect = isAnswered && userAnswers[qId] === questionsData.find(q => q.id === qId).correctIndex;

        if (currentFilter === 'all') {
          card.classList.remove('hidden');
        } else if (currentFilter === 'wrong') {
          if (isAnswered && !isCorrect) {
            card.classList.remove('hidden');
          } else {
            card.classList.add('hidden');
          }
        } else if (currentFilter === 'unanswered') {
          if (!isAnswered) {
            card.classList.remove('hidden');
          } else {
            card.classList.add('hidden');
          }
        }
      });
    }

    function submitExam() {
      let correct = 0;
      const total = questionsData.length;
      questionsData.forEach(q => {
        if (userAnswers[q.id] === q.correctIndex) correct++;
      });

      const percentage = Math.round((correct / total) * 100);
      document.getElementById('finalScoreDisplay').textContent = `${correct} / ${total}`;
      document.getElementById('finalPercentage').textContent = `${percentage}% - ${percentage >= 60 ? 'ناجح ✅' : 'يحتاج إلى مراجعة ⚠️'}`;

      if (percentage >= 80) {
        document.getElementById('modalIcon').textContent = '🌟';
        document.getElementById('modalTitle').textContent = 'ممتاز! نتيجة رائعة';
      } else if (percentage >= 50) {
        document.getElementById('modalIcon').textContent = '👍';
        document.getElementById('modalTitle').textContent = 'أداء جيد، راجع الأخطاء';
      } else {
        document.getElementById('modalIcon').textContent = '📚';
        document.getElementById('modalTitle').textContent = 'حاول مرة أخرى لتحسين مستواك';
      }

      document.getElementById('resultModal').classList.remove('hidden');
      switchMode('practice');
    }

    function closeModal() {
      document.getElementById('resultModal').classList.add('hidden');
    }

    function restartQuiz() {
      if (confirm("هل تريد إعادة ضبط جميع الإجابات والبدء من جديد؟")) {
        userAnswers = {};
        closeModal();
        renderQuestions();
        renderNavigator();
        updateStats();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
